default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# For production on Render free tier, we use memory_store instead of solid_cache
# This is configured in config/environments/production.rb
production:
  <<: *default
