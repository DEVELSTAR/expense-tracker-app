# render.yaml - Render Blueprint for ExpenseTracker
# https://render.com/docs/blueprint-spec

services:
  # Web Service
  - type: web
    name: expense-tracker
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"

# PostgreSQL Database
databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker_production
    user: expense_tracker
